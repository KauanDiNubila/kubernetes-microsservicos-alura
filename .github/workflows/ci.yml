name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [server, gateway, pedidos, pagamentos]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ${{ matrix.servico }}/pom.xml

      - name: Rodar os testes
        run: mvn -B test

  manifests:
    name: Validar manifests do Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validar com kubeconform
        run: >
          docker run --rm -v "$PWD/k8s:/k8s"
          ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary /k8s
